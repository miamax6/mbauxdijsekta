<body><div id="app"></div>
<script>
/* ===== Logique pure : aucun accès au DOM ===== */
const EMPTY_STATE = () => ({
  app: 'comptes-couple', schema: 1,
  settings: {
    noms: { a: 'Moi', b: 'Conjoint·e' },
    impotTaux: { a: 0, b: 0 },
    taxes: { pea: 0.828, av: 0.828, cto: 0.7 },
    livretA: 0.015,
    credit: { mensualite: 0, nbMois: 0, debut: '' },
    vacancesDebut: '',
    reventeOr: 0.8,
    simu: { plafond: 0.35, duree: 25, taux: [0.03, 0.035, 0.04] },
    cours: { orOnce: 0, argentOnce: 0, date: '' }
  },
  salaires: [], quotidien: [], loisirs: [], vacances: [], virements: [], comptes: [],
  interets: { annees: [new Date().getFullYear()], lignes: [] },
  placements: {
    peaA: { titre: 'PEA', who: 'a', retrait: '', taxe: 'pea', virements: [], actifs: [] },
    ctoA: { titre: 'Compte-titres', who: 'a', taxe: 'cto', especes: 0, actifs: [] },
    avA: { titre: 'Assurance vie', who: 'a', retrait: '', taxe: 'av', fondsEuros: { investi: 0, taux: 0 }, actifs: [] },
    peaB: { titre: 'PEA', who: 'b', retrait: '', taxe: 'pea', virements: [], actifs: [] },
    objets: []
  },
  achats: [{ annee: String(new Date().getFullYear()), items: [] }]
});

const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const sum = (arr, f = x => x) => arr.reduce((s, x) => s + (f(x) || 0), 0);

function monthsBetween(fromISO, to) { // équivalent DATEDIF(..., "m")
  if (!fromISO) return 0;
  const f = new Date(fromISO + (fromISO.length === 7 ? '-01' : ''));
  let m = (to.getFullYear() - f.getFullYear()) * 12 + (to.getMonth() - f.getMonth());
  if (to.getDate() < f.getDate()) m--;
  return Math.max(0, m);
}

function calcPlacement(p, cfg, now) {
  const taxe = cfg.taxes[p.taxe] ?? 1;
  const actifs = (p.actifs || []).map(a => {
    const qty = sum(a.lots || [], l => num(l.qty));
    const cout = sum(a.lots || [], l => (l.montant !== undefined && l.montant !== '' && l.montant !== null) ? num(l.montant) : num(a.pru) * num(l.qty));
    const valeur = num(a.cours) * qty;
    return { ...a, qty, cout, valeur, pruCalc: qty ? cout / qty : 0, pv: valeur - cout };
  });
  const valeurActifs = sum(actifs, a => a.valeur);
  const coutActifs = sum(actifs, a => a.cout);
  const hasVirt = Array.isArray(p.virements);
  const investi = hasVirt ? sum(p.virements, v => num(v.montant)) : coutActifs;
  const especes = hasVirt ? investi - coutActifs : num(p.especes);
  let fonds = 0, fondsInvesti = 0;
  if (p.fondsEuros) { fondsInvesti = num(p.fondsEuros.investi); fonds = fondsInvesti; }
  const investiTotal = investi + fondsInvesti;
  // PEA : les espèces sont déjà dans la plus-value ; CTO : espèces à part (comme l'Excel)
  const pv = hasVirt ? valeurActifs + especes - investi : valeurActifs - investi;
  const pvNet = pv > 0 ? pv * taxe : pv;
  const totalApresImpot = hasVirt ? investi + pvNet : investiTotal + pvNet + (p.especes ? num(p.especes) : 0);
  const totalBrut = valeurActifs + fonds + (hasVirt ? especes : num(p.especes));
  const premier = hasVirt ? (p.virements.map(v => v.date).sort()[0] || '') : ((actifs.flatMap(a => (a.lots || []).map(l => l.date))).sort()[0] || '');
  const jours = premier ? Math.max(1, (now - new Date(premier + '-01')) / 864e5) : 0;
  const rendement = investiTotal ? pv / investiTotal : 0;
  return { actifs, valeurActifs, coutActifs, investi: investiTotal, especes, pv, pvNet, totalBrut, totalApresImpot, rendement,
           annualise: jours ? rendement / jours * 365 : 0, premier,
           retraitMois: p.retrait ? Math.max(0, monthsBetween(now.toISOString().slice(0, 10), new Date(p.retrait))) : null };
}

function calc(S, now = new Date(), cours = null) {
  const cfg = S.settings, R = { cfg };
  const cs = (cours && num(cours.orOnce) > 0) ? cours : cfg.cours; R.cours = cs;
  // --- Revenus
  R.brut = { a: 0, b: 0 }; R.imposable = { a: 0, b: 0 };
  S.salaires.forEach(s => { R.brut[s.who] += num(s.montant); if (s.imposable) R.imposable[s.who] += num(s.montant); });
  R.impots = { a: R.imposable.a * num(cfg.impotTaux.a), b: R.imposable.b * num(cfg.impotTaux.b) };
  R.part = { a: R.brut.a - R.impots.a, b: R.brut.b - R.impots.b };
  R.brutTotal = R.brut.a + R.brut.b;
  R.net = R.part.a + R.part.b;
  R.ratio = { a: R.net ? R.part.a / R.net : 0.5, b: R.net ? R.part.b / R.net : 0.5 };
  // --- Vacances (moyenne mensuelle depuis la date de départ)
  R.vacTotal = sum(S.vacances, v => num(v.montant));
  let moisVac = 0;
  if (cfg.vacancesDebut) {
    const d = new Date(cfg.vacancesDebut);
    moisVac = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth()) + now.getDate() / 30;
  }
  R.vacMois = moisVac; R.vacMoy = moisVac > 0 ? R.vacTotal / moisVac : 0;

/* ---------- Fiche d'édition (feuille du bas) ---------- */
function specFor(path) {
  const who = sh => ['who', 'sel', 'Pour', whoOpts(sh)];
  let m;
  if (/^salaires\.\d+$/.test(path)) return { title: 'Salaire', f: [['label', 'text', 'Libellé'], ['montant', 'num', 'Montant mensuel (€)'], who(false), ['imposable', 'chk', 'Soumis au calcul d\'impôt']] };
  if (/^(quotidien|loisirs)\.\d+$/.test(path)) { const o = get(S, path); return { title: 'Dépense', f: [['label', 'text', 'Libellé'], ...(o.auto ? [] : [['montant', 'num', 'Montant mensuel (€)']]), who(true)], note: o.auto ? 'Le montant est calculé depuis les vacances.' : '' }; }
  if (/^vacances\.\d+$/.test(path)) return { title: 'Séjour', f: [['label', 'text', 'Libellé'], ['montant', 'num', 'Coût (€)']] };
  if (/^virements\.\d+$/.test(path)) return { title: 'Virement', f: [['label', 'text', 'Libellé'], ['montant', 'num', 'Montant total (€)']], note: 'Réparti au prorata des salaires nets.' };
  if (/^comptes\.\d+$/.test(path)) { const o = get(S, path); return { title: 'Compte', f: [['label', 'text', 'Nom'], ...(o.auto ? [] : [['montant', 'num', 'Solde (€)']]), who(true), ['banque', 'text', 'Banque (CA, F, HB…)'], ['apport', 'chk', 'Compte dans l\'apport du simulateur']], note: o.auto ? 'Le solde est calculé depuis Placements.' : '' }; }
  if (/^interets\.lignes\.\d+$/.test(path)) return { title: 'Intérêts d\'un compte', f: [['label', 'text', 'Compte'], who(false), ...S.interets.annees.map(y => ['v.' + y, 'num', 'Intérêts ' + y + ' (€)'])] };
  if (/^placements\.objets\.\d+$/.test(path)) return { title: 'Objet en or', f: [['label', 'text', 'Objet'], ['grammes', 'num', 'Poids (g)'], ['titre', 'num', 'Titre (1 = pur, 0,585 = 14 carats)']] };
  if ((m = path.match(/^achats\.(\d+)\.items\.\d+$/))) return { title: 'Achat ou vente', f: [['label', 'text', 'Libellé'], ['achat', 'num', 'Achat (€)'], ['vente', 'num', 'Vente (€)'], who(true)] };
  if ((m = path.match(/^placements\.(\w+)\.actifs\.\d+$/))) { const p = S.placements[m[1]]; const pru = Array.isArray(p.virements) || p.fondsEuros; return { title: 'Actif', f: [['nom', 'text', 'Nom'], ['isin', 'text', 'Code ISIN'], ['cours', 'num', 'Cours actuel (€)'], ...(pru ? [['pru', 'num', 'Prix de revient moyen (€)']] : [])], lots: true, hasVirt: Array.isArray(p.virements) }; }
  if (/^placements\.\w+\.virements$/.test(path)) return { title: 'Virements versés', list: [['date', 'month', ''], ['montant', 'num', '€']] };
  return { title: 'Modifier', f: [] };
}
function sheetHtml() {
  if (!editing) return '';
  const spec = specFor(editing.path), obj = get(S, editing.path);
  if (!obj) return '';
  let body = '';
  if (spec.list) {
    body = obj.map((x, j) => `<div class="lrow">${spec.list.map(([k, t, ph]) => fld(`${editing.path}.${j}.${k}`, x[k], { t, ph })).join('')}<button class="x" data-delin="${editing.path}.${j}" aria-label="Supprimer">×</button></div>`).join('') + `<button class="add" data-addin="${editing.path}">+ Ajouter</button>`;
  } else {
    body = spec.f.map(([k, t, l, opts]) => t === 'chk' ? fld(`${editing.path}.${k}`, get(obj, k) !== false && (k === 'apport' ? true : !!get(obj, k)), { t: 'chk', txt: l }) :
      field(l, t === 'sel' ? fld(`${editing.path}.${k}`, get(obj, k), { t: 'sel', opts }) : fld(`${editing.path}.${k}`, get(obj, k), { t })) ).join('');
    if (spec.note) body += `<p class="hint">${spec.note}</p>`;
    if (spec.lots) {
      const c = editing.path.split('.'); const lots = obj.lots || [];
      body += `<h4>Achats</h4>` + lots.map((l, j) => `<div class="lrow">${fld(`${editing.path}.lots.${j}.date`, l.date, { t: 'month' })}${fld(`${editing.path}.lots.${j}.qty`, l.qty, { ph: 'Qté' })}${spec.hasVirt ? '' : fld(`${editing.path}.lots.${j}.montant`, l.montant, { ph: '€ payés' })}<button class="x" data-delin="${editing.path}.lots.${j}" aria-label="Supprimer">×</button></div>`).join('') + `<button class="add" data-addin="${editing.path}.lots">+ Achat</button>`;
    }
  }
  const canDel = !spec.list;
  return `<div class="sheet" data-close><div class="sheetin" role="dialog" aria-label="${esc(spec.title)}"><div class="grab"></div><h3>${esc(spec.title)}</h3><div class="sbody">${body}</div>
    <div class="btnrow">${canDel ? `<button class="btn danger" data-delete="${editing.path}">Supprimer</button>` : ''}<button class="btn pri grow" data-done>Terminé</button></div></div></div>`;
}

const VIEWS = { accueil: ['Accueil', vAccueil], budget: ['Budget', vBudget], epargne: ['Épargne', vEpargne], placements: ['Placements', vPlacements], achats: ['Achats et ventes', vAchats], simu: ['Emprunt', vSimu], reglages: ['Réglages', vReglages] };
const TABS = [['accueil', '🏠', 'Accueil'], ['budget', '🧾', 'Budget'], ['epargne', '🐖', 'Épargne'], ['placements', '📈', 'Placements']];
let lastView = null;
function render() {
  R = R || recalc();
  const [title, fn] = VIEWS[view];
  const fresh = lastView !== view; lastView = view;
  document.getElementById('app').innerHTML = `
  <header class="top"><h1>${title}</h1><span id="syncpill" class="pill off"></span></header>
  <main class="${fresh ? 'anim' : ''}">${fn()}</main>
  <nav class="nav">${TABS.map(([k, e, l]) => `<button class="tab ${view === k ? 'on' : ''}" data-go="${k}"><span class="te">${e}</span><span>${l}</span></button>`).join('')}
    <button class="tab ${['achats', 'simu', 'reglages'].includes(view) ? 'on' : ''}" data-more><span class="te">⋯</span><span>Plus</span></button></nav>
  ${moreOpen ? `<div class="sheet" data-close><div class="sheetin more"><button data-go="achats">🛍️ Achats et ventes</button><button data-go="simu">🏡 Emprunt</button><button data-go="reglages">⚙️ Réglages</button></div></div>` : ''}
  ${sheetHtml()}<div id="toast" role="status"></div>`;
  paintPill(document.getElementById('syncpill'));
}
function renderKeepFocus() {
  setTimeout(() => {
    const a = document.activeElement, p = a && a.dataset && a.dataset.p, y = window.scrollY, sb = document.querySelector('.sbody'), sy = sb ? sb.scrollTop : 0;
    render(); window.scrollTo(0, y); const nb = document.querySelector('.sbody'); if (nb) nb.scrollTop = sy;
    if (p) { const el = document.querySelector(`[data-p="${p}"]`); if (el && el.type !== 'checkbox' && el.tagName !== 'SELECT') try { el.focus({ preventScroll: true }); } catch (e) {} }
  }, 0);
}
function toast(t) { const el = document.getElementById('toast'); if (!el) return; el.textContent = t; el.className = 'show'; setTimeout(() => el.className = '', 3200); }

/* ---------- Cours de l'or et de l'argent (automatiques) ---------- */
let metalsErr = '';
async function fetchMetals() {
  metalsState = 'busy'; if (view === 'placements') render();
  try {
    const r = await fetch('https://xaus.com/api/v1/spot?currency=EUR&compact=1', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(), or = j.xau && j.xau.price;
    if (!(or > 0)) throw new Error('réponse inattendue');
    const fx = j.fx_rate > 0 ? j.fx_rate : (j.spot_usd_oz > 0 ? or / j.spot_usd_oz : 0), ag = j.silver_usd_oz > 0 && fx > 0 ? j.silver_usd_oz * fx : 0;
    METALS = { orOnce: or, argentOnce: ag, date: j.updated_at || new Date().toISOString() };
    LS.set('cc.metals', JSON.stringify(METALS)); metalsState = 'ok'; R = recalc();
  } catch (e) { metalsState = 'err'; metalsErr = e.message; R = recalc(); }
  render();
}

/* ---------- Événements ---------- */
const NEW = {
  salaires: () => ({ label: '', montant: 0, who: 'a', imposable: true }), quotidien: () => ({ label: '', montant: 0, who: '' }), loisirs: () => ({ label: '', montant: 0, who: '' }),
  vacances: () => ({ label: '', montant: 0 }), virements: () => ({ label: '', montant: 0 }), comptes: () => ({ label: '', banque: '', who: 'a', montant: 0 }),
  'interets.lignes': () => ({ label: '', who: 'a', v: {} }), 'placements.objets': () => ({ label: '', grammes: 0, titre: 1 })
};
const thisMonth = () => new Date().toISOString().slice(0, 7);
function newItem(path) {
  if (NEW[path]) return NEW[path]();
  if (/\.actifs$/.test(path)) return { nom: '', isin: '', cours: 0, pru: 0, lots: [] };
  if (/\.lots$/.test(path)) return { date: thisMonth(), qty: 0 };
  if (/\.virements$/.test(path)) return { date: thisMonth(), montant: 0 };
  if (/\.items$/.test(path)) return { label: '', achat: 0, vente: 0, who: 'a' };
  return {};
}
document.addEventListener('change', e => {
  const el = e.target.closest('[data-p]');
  if (el) {
    const p = el.dataset.p, t = el.dataset.t; let v;
    if (t === 'chk') v = el.checked; else if (t === 'sel' || t === 'text' || t === 'month' || t === 'date') v = el.value;
    else if (t === 'pct') v = num(el.value) / 100; else v = el.value.trim() === '' ? '' : num(el.value);
    if (p.startsWith('cfg.')) { CFG[p.slice(4)] = v; LS.set('cc.cfg', JSON.stringify(CFG)); render(); return; }
    set(S, p, v); commit(); return;
  }
  if (e.target.dataset && e.target.dataset.act === 'import') importFile(e.target.files[0]);
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-close]'); if (!t) return;
  const d = t.dataset;
  if ('close' in d) { if (e.target === t) { editing = null; moreOpen = false; render(); } return; }
  if ('done' in d) { editing = null; render(); return; }
  if (d.edit) { editing = { path: d.edit }; render(); return; }
  if (d.bmode) { bmode = d.bmode; LS.set('cc.bmode', bmode); render(); window.scrollTo(0, 0); return; }
  if (d.go) { view = d.go; moreOpen = false; editing = null; render(); window.scrollTo(0, 0); return; }
  if ('more' in d) { moreOpen = true; render(); return; }
  if (d.add) { const arr = get(S, d.add); arr.push(newItem(d.add)); if (/\.(virements|lots)$/.test(d.add)) { editing = editing || null; } else editing = { path: d.add + '.' + (arr.length - 1) }; commit(); return; }
  if (d.addin) { get(S, d.addin).push(newItem(d.addin)); commit(); return; }
  if (d.delin) { const ks = d.delin.split('.'), i = +ks.pop(); get(S, ks.join('.')).splice(i, 1); commit(); return; }
  if (d.delete) { const ks = d.delete.split('.'), i = +ks.pop(); get(S, ks.join('.')).splice(i, 1); editing = null; commit(); return; }
  if ('addyear' in d) { const a = S.interets.annees; a.push(a[a.length - 1] + 1); commit(); return; }
  if ('addyearachat' in d) { S.achats.push({ annee: String(new Date().getFullYear() + S.achats.length), items: [] }); commit(); return; }
  if (d.act === 'metals') { fetchMetals(); return; }
  if (d.act === 'syncnow') { await pull(false); if (sync.state === 'dirty') await push(); if (sync.state === 'ok') toast('Synchronisé'); render(); return; }
  if (d.act === 'keeplocal') { await push(true); render(); return; }
  if (d.act === 'keepremote') { meta.dirty = false; meta.sha = ''; await pull(false); render(); return; }
  if (d.act === 'export') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'comptes-couple_donnees_' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); return; }
  if (d.act === 'reset') { if (confirm('Effacer les données de cet appareil ?')) { LS.del('cc.state'); LS.del('cc.meta'); S = EMPTY_STATE(); meta = { sha: '', dirty: false, at: '' }; R = recalc(); render(); } return; }
});
async function importFile(f) {
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'comptes-couple') throw new Error('Ce fichier n\'est pas un fichier de données de l\'appli.');
    S = Object.assign(EMPTY_STATE(), j); R = recalc(); meta.dirty = true; saveLocal(); view = 'accueil'; render(); toast('Fichier importé'); schedulePush();
  } catch (e) { toast('Import impossible : ' + e.message); }
}

/* ---------- Démarrage ---------- */
loadLocal(); R = recalc(); render();
fetchMetals();
if (cfgOK()) pull(true);
window.addEventListener('online', () => { if (cfgOK()) pull(true); fetchMetals(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (cfgOK() && !meta.dirty) pull(true);
  if (!METALS.date || Date.now() - new Date(METALS.date) > 30 * 60 * 1000) fetchMetals();
});

</script></body></html>
