<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b82"><meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comptes">
<title>Comptes du foyer</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{--bg:#eef1f3;--sf:#fff;--ink:#1c2733;--mu:#66727e;--ln:#e0e5e9;--in:#f3f5f7;--track:#e6eaee;--pos:#2a8562;--neg:#b8483d;--ac:#2f6b82;--ac2:#4a8ba3;--ca:#c06a38;--cat:#a9521f;--cb:#e3cc78;--cbt:#8f7620;--onb:#3a2c00;--mint:#5aa58a;--coral:#c8695e;--shadow:0 4px 16px rgba(30,50,70,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#12181d;--sf:#1b242b;--ink:#e8eef2;--mu:#98a6b1;--ln:#2a353e;--in:#151d23;--track:#26313a;--pos:#5fc59f;--neg:#e58a7e;--ac:#7db3c8;--ac2:#5f97ad;--ca:#d9834f;--cat:#e79a6a;--cb:#e6d078;--cbt:#e6d078;--onb:#2a2000;--shadow:0 4px 16px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#app{max-width:680px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h1{font-size:1.4rem;margin:0;font-weight:800;letter-spacing:-.02em}
main{padding:4px 12px 24px;display:grid;gap:14px}
.pill{font-size:.78rem;padding:4px 11px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);background:var(--sf);font-weight:600}
.pill.ok{color:var(--pos);border-color:var(--pos)}.pill.warn{color:#9a7410;border-color:var(--cb)}.pill.bad{color:var(--neg);border-color:var(--neg)}
.sec{background:var(--sf);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.sec>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
h2{font-size:1.05rem;margin:0;font-weight:800;letter-spacing:-.01em}h2 em{font-style:normal;margin-left:4px}
h3{font-size:.95rem;margin:0 0 6px;font-weight:800}h4{margin:14px 0 6px;font-size:.9rem}
.tot{font-weight:800;color:var(--ac)}.hint{color:var(--mu);font-size:.84rem;margin:10px 0 0}
/* héros */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px;color:#fff;background:linear-gradient(135deg,#2c4d63 0%,#3b6b80 100%);box-shadow:0 8px 22px rgba(44,77,99,.28)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%)}
.hero small{display:block;opacity:.85;font-weight:600;font-size:.88rem}
.hero .big{font-size:2.7rem;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:2px 0 10px;text-shadow:0 2px 14px rgba(0,0,0,.18)}
.hero.small{padding:16px 18px}.hero.small .big{font-size:2.2rem}
.hchips{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}.hchips span{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:4px 11px;font-size:.82rem;font-weight:700;backdrop-filter:blur(6px)}
/* donut */
.donutw{display:grid;gap:12px;justify-items:center}
.dsvg{position:relative;width:min(70vw,220px);aspect-ratio:1}.dsvg svg{width:100%;height:100%;display:block;}
.dcen{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.dcen small{color:var(--mu);font-size:.72rem;font-weight:600}.dcen b{font-size:1.25rem;font-weight:900;letter-spacing:-.02em}
.dleg{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:5px}
.dleg li{display:grid;grid-template-columns:12px minmax(0,1fr) auto 3rem;gap:8px;align-items:center;font-size:.9rem}.dleg i{width:12px;height:12px;border-radius:4px}.dleg b{font-weight:800}.dleg em{color:var(--mu);font-style:normal;text-align:right;font-size:.82rem}
.enter .dsvg,.enter .line,.enter .vb{animation:pop .7s cubic-bezier(.23,1,.32,1) both}
.anim .sec.enter{animation:up .5s cubic-bezier(.23,1,.32,1) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* barres */
.hb{display:grid;gap:9px}.hbr{display:grid;grid-template-columns:minmax(0,7.2rem) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.86rem}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbt{height:12px;border-radius:7px;background:var(--track);overflow:hidden}.hbt i{display:block;height:100%;border-radius:7px}.hbr b{font-weight:800;white-space:nowrap}
.vb{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;padding-top:6px}.vbc{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}.vbc b{font-size:.78rem}.vbb{width:100%;max-width:56px;border-radius:10px 10px 4px 4px}.vbc span{font-size:.78rem;color:var(--mu)}
.line{width:100%;height:auto;display:block}.lax{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;color:var(--mu)}.lax b{color:var(--ink);font-size:.95rem}
/* jauges & cartes */
.gauge{height:10px;border-radius:6px;background:var(--track);overflow:hidden;margin:7px 0 2px}.gauge i{display:block;height:100%;border-radius:6px}
.gok{background:var(--mint)}.gko{background:var(--coral)}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat{background:var(--sf);border-radius:18px;padding:12px 10px;box-shadow:var(--shadow)}
.cat h3{display:flex;flex-direction:column;gap:0;margin:0 0 4px;font-size:.88rem}.cat h3 span{font-size:1.4rem}.cat h3 small{color:var(--mu);font-weight:700;font-size:.76rem}
.cat:nth-child(1){border-top:4px solid #4a6fa5}.cat:nth-child(2){border-top:4px solid #4f9a94}.cat:nth-child(3){border-top:4px solid #86a862}
.cv{font-size:1.15rem;font-weight:900;letter-spacing:-.02em}.cm{font-size:.74rem;color:var(--mu);margin-top:3px;line-height:1.25}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.person{background:var(--sf);border-radius:20px;padding:14px;box-shadow:var(--shadow)}.person.pa{border-top:5px solid var(--ca)}.person.pb{border-top:5px solid var(--cb)}
.person.pa h3{color:var(--cat)}.person.pb h3{color:var(--cbt)}.pbig{font-size:1.6rem;font-weight:900;letter-spacing:-.03em}.person small{color:var(--mu);font-size:.78rem}.pl{font-size:.8rem;color:var(--mu);margin-top:3px}
.prow{padding:12px 0;border-top:1px solid var(--ln)}.prow:first-of-type{border-top:0;padding-top:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}.ph b{font-size:1.05rem}.ph span{color:var(--mu);font-size:.84rem}
.prow.pa .ph b{color:var(--cat)}.prow.pb .ph b{color:var(--cbt)}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pg>div{display:flex;flex-direction:column;gap:2px}.pg span{font-size:.76rem;color:var(--mu)}.pg b{font-size:1rem}.pg em{font-style:normal;font-size:.72rem;color:var(--mu)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--ln);font-size:.92rem}.sec>.kv:first-of-type{border-top:0}.kv span{color:var(--mu)}.kv b{font-weight:800}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}.split .kv{flex-direction:column;border:0;background:var(--in);border-radius:12px;padding:8px 10px;gap:0}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.vr{display:grid;grid-template-columns:minmax(0,1fr) 5.6rem 5.6rem;gap:8px;padding:7px 0;border-top:1px solid var(--ln);font-size:.92rem;align-items:baseline}.vr b{text-align:right}.vr.vh{border-top:0;color:var(--mu);font-size:.8rem}.vr.vt{font-weight:800}
/* placements */
.metals{display:grid;grid-template-columns:1fr 1fr auto;gap:8px 10px;align-items:center;border-radius:20px;padding:14px;color:#3a3010;background:linear-gradient(120deg,#ece2bb,#dcc98a);box-shadow:0 4px 14px rgba(150,125,50,.22)}
.mt{display:grid;gap:0}.mt span{font-weight:700;font-size:.85rem}.mt b{font-size:1.35rem;font-weight:900;letter-spacing:-.02em}.mt small{font-size:.72rem;opacity:.75}
.refresh{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.55);font-size:1.4rem;font-weight:800;color:#3a3010;cursor:pointer}.refresh:active{transform:scale(.94)}
.mst{grid-column:1/-1;font-size:.78rem;font-weight:600}
.pmain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}.pm1{background:var(--in);border-radius:14px;padding:9px 10px;display:grid;gap:2px}.pm1 small{color:var(--mu);font-size:.72rem;font-weight:600}.pm1 b{font-size:.98rem}
.prod .hb{margin:8px 0}
/* lignes cliquables */
.row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;border:0;border-top:1px solid var(--ln);padding:11px 2px;cursor:pointer;border-radius:0}
.sec>.row:first-of-type{border-top:0}
.row:active{background:var(--in)}.ri{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:12px;background:var(--in);color:var(--ac)}.ic{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.rt{display:grid;min-width:0}.rt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rt small{color:var(--mu);font-size:.78rem}.ra{font-weight:800;white-space:nowrap}
.chip{font-style:normal;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff}.chip.pa{background:var(--ca)}.chip.pb{background:var(--cb);color:var(--onb)}.chip.bk{background:var(--mu)}
.add{border:2px dashed var(--ln);background:transparent;color:var(--ac);font:inherit;font-weight:800;padding:12px;border-radius:14px;width:100%;margin-top:8px;cursor:pointer}.add.ghost{border-style:solid;background:var(--in)}
.add:active,.btn:active,.tab:active{transform:scale(.97)}
.btn{display:inline-block;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-weight:800;padding:12px 16px;border-radius:14px;cursor:pointer;text-align:center}
.btn.pri{background:var(--ac);color:#fff;border:0}.btn.danger{color:var(--neg);border-color:var(--neg)}.btn.grow{flex:1}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* formulaires */
.f{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--in);border:2px solid transparent;border-radius:12px;padding:11px 12px}
.f:focus{outline:0;border-color:var(--ac);background:var(--sf)}select.f{padding:11px 8px}
.fl{display:grid;gap:4px;margin-bottom:12px}.fl>span{font-size:.8rem;color:var(--mu);font-weight:700}
.form{display:grid;gap:2px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.6rem,1fr));gap:8px;margin-bottom:8px}.grid3 label,.inl3 label{display:grid;gap:3px;font-size:.8rem;color:var(--mu);font-weight:700}
.inl{display:flex;align-items:center;gap:8px;margin:8px 0}.inl>span{color:var(--mu);font-size:.88rem;flex:1}.inl .f{width:8.5rem;flex:none}.inl em{color:var(--mu);font-style:normal;font-size:.85rem}
.inl3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0}
.calc{display:block;padding:11px 4px;font-weight:800;color:var(--mu)}
.chk{display:flex;align-items:center;gap:10px;margin:4px 0 12px;font-weight:600}.chk input{width:24px;height:24px;accent-color:var(--ac)}
.lrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(6rem,1fr)) 2.2rem;gap:6px;margin-bottom:6px;align-items:center}
.x{border:0;background:transparent;color:var(--mu);font-size:1.5rem;line-height:1;width:2.2rem;height:2.2rem;border-radius:10px;cursor:pointer}.x:active{background:var(--in)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border-radius:16px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{font:inherit;font-weight:800;color:var(--mu);background:transparent;border:0;border-radius:12px;padding:11px;cursor:pointer;transition:background .18s cubic-bezier(.23,1,.32,1),color .18s cubic-bezier(.23,1,.32,1)}
.seg button.on{background:var(--ac);color:#fff}.seg.pers button.on.a{background:var(--ca);color:#fff}.seg.pers button.on.b{background:var(--cb);color:var(--onb)}
.warnbox{border:2px solid var(--neg);border-radius:14px;padding:12px;margin-top:8px}
/* navigation et fiches */
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;max-width:660px;margin:0 auto;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:6px;box-shadow:0 8px 24px rgba(30,50,70,.18)}
.tab{flex:1;border:0;background:transparent;color:var(--mu);font:inherit;font-size:.7rem;font-weight:700;display:grid;justify-items:center;gap:0;padding:6px 2px;border-radius:18px;cursor:pointer;transition:background .18s cubic-bezier(.23,1,.32,1)}
.te{display:grid;place-items:center;height:26px}.te .ic{width:24px;height:24px}.tab.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.sheet{position:fixed;inset:0;z-index:8;background:rgba(15,22,30,.5);display:flex;align-items:flex-end;animation:fade .2s ease-out both}
.sheetin{width:100%;max-width:680px;margin:0 auto;background:var(--sf);border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.23,1,.32,1) both}
.sbody{overflow:auto;padding:2px 2px 4px}.grab{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 10px}.sheetin h3{font-size:1.15rem;margin:0 0 12px}
.sheetin.more{padding-bottom:calc(100px + env(safe-area-inset-bottom));gap:8px}.sheetin.more button{display:flex;align-items:center;gap:12px;font:inherit;font-weight:700;color:var(--ink);background:var(--in);border:0;border-radius:14px;padding:16px;text-align:left;font-size:1.02rem}.sheetin.more .ic{width:22px;height:22px;color:var(--ac)}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.9rem;font-weight:600;transition:opacity .2s cubic-bezier(.23,1,.32,1),transform .2s cubic-bezier(.23,1,.32,1);z-index:9;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
.sec.empty{text-align:center;padding:28px 16px}
@media (hover:hover) and (pointer:fine){.row:hover{background:var(--in)}.add:hover,.btn:hover{border-color:var(--ac)}.x:hover{color:var(--neg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.cats,.pg,.pmain{grid-template-columns:1fr}.hero .big{font-size:2.3rem}}
@media (min-width:640px){main{padding:8px 16px 24px}}

.steps{margin:0 0 12px;padding-left:1.2rem;display:grid;gap:6px;font-size:.88rem;color:var(--mu)}.steps b{color:var(--ink)}

.dcen{pointer-events:none}.dsvg svg{overflow:visible}
circle.seg{cursor:pointer;transition:opacity .22s cubic-bezier(.23,1,.32,1),stroke-width .28s cubic-bezier(.23,1,.32,1)}
.dleg li{cursor:pointer;border-radius:8px;transition:opacity .2s cubic-bezier(.23,1,.32,1)}.dleg li.dim{opacity:.4}
.cat,.person,.pm1,.vbc,.hbr,.prow,.metals{transition:transform .16s cubic-bezier(.23,1,.32,1)}

.hswitch{display:flex;align-items:center;gap:8px;background:var(--in);border:0;border-radius:12px;padding:7px 10px 7px 12px;color:var(--ink);font:inherit;cursor:pointer;text-align:left;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.hswitch h2{font-size:1.02rem}.hswitch .ic{width:18px;height:18px;color:var(--ac);flex:none}.hswitch:active{transform:scale(.96)}
.split.two{grid-template-columns:1fr 1fr}.hint.tight{margin:-2px 4px 0}

/* ---- v3 : bulles d'aide, info, couleurs des personnes, cours, mise en page PC ---- */
.ht{display:flex;align-items:center;gap:8px;min-width:0}
.info{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);background:transparent;color:var(--mu);font:italic 700 .72rem/1 Georgia,serif;display:inline-grid;place-items:center;padding:0;cursor:pointer;margin-left:6px;transition:transform .16s cubic-bezier(.23,1,.32,1),color .16s,border-color .16s}
.ht .info{margin-left:0}.info:active{transform:scale(.9)}@media (hover:hover){.info:hover{color:var(--ac);border-color:var(--ac)}}
#tip{position:fixed;z-index:20;max-width:min(320px,calc(100vw - 16px));background:#1c2733;color:#f2f5f7;padding:10px 12px;border-radius:12px;font-size:.84rem;line-height:1.4;white-space:pre-line;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .16s cubic-bezier(.23,1,.32,1),transform .16s cubic-bezier(.23,1,.32,1)}
#tip.show{opacity:1;transform:none}
[data-tip]{cursor:help}.gauge{position:relative}.gauge::after{content:"";position:absolute;inset:-9px 0}
.pn.a,.ca{color:var(--cat)}.pn.b,.cb{color:var(--cbt)}.pn{font-weight:800}
.hero .pn.a{color:#f2b08a}.hero .pn.b{color:#efdc98}
.salc{background:var(--in);border-radius:16px;padding:12px}.salc.pa{border-left:5px solid var(--ca)}.salc.pb{border-left:5px solid var(--cb)}
.salc h3{margin:0 0 2px}.salc.pa h3{color:var(--cat)}.salc.pb h3{color:var(--cbt)}
.sbig{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}.sbig small{display:block;font-size:.74rem;color:var(--mu);font-weight:600;letter-spacing:0}
.sl{display:grid;gap:2px;margin:8px 0;font-size:.85rem}.sl div{display:flex;justify-content:space-between;gap:6px}.sl span{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsel{font:inherit;font-weight:800;font-size:1.02rem;color:var(--ink);background:var(--in);border:0;border-radius:12px;padding:8px 10px;max-width:100%;cursor:pointer}
.hsel:focus{outline:2px solid var(--ac)}
.cours .refresh{width:38px;height:38px;border-radius:50%;border:0;background:var(--in);color:var(--ac);font-size:1.25rem;font-weight:800;cursor:pointer}.cours .refresh:active{transform:scale(.94)}
.ctg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ct{display:grid;gap:1px;text-align:left;font:inherit;color:var(--ink);background:var(--in);border:0;border-radius:14px;padding:9px 11px;min-width:0}
button.ct{cursor:pointer}button.ct:active{transform:scale(.97)}
.ct span{font-size:.72rem;color:var(--mu);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ct b{font-size:1.02rem;font-weight:800}.ct em{font-style:normal;font-size:.68rem;color:var(--mu)}
.mst{font-size:.76rem;color:var(--mu);margin-top:8px}
.ra{text-align:right;display:grid;justify-items:end}.ra small{font-size:.74rem;font-weight:700}
.dl{margin:6px 0 2px}.sub{margin:12px 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.btnline{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btnline .add{margin-top:8px}
.kv span{display:inline-flex;align-items:center}
.pmain .pm1 b{font-size:.94rem}
@media (max-width:420px){.btnline{grid-template-columns:1fr}}
/* --- PC : pleine largeur, menu à gauche, colonnes multiples --- */
.tab.extra{display:none}
@media (min-width:900px){
  body{padding-bottom:28px}
  #app{max-width:none;padding-left:228px}
  .top{padding:14px 28px}
  h1{font-size:1.6rem}
  main{padding:8px 28px 28px}
  .mtop>*{margin:0 0 18px}
  .mflow{column-width:340px;column-gap:18px}
  .mflow>*{break-inside:avoid;margin:0 0 18px}
  .mprods{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;align-items:start}
  .mprods>*{margin:0}
  main>.seg,.mtop>.seg{max-width:460px}
  .nav{left:0;top:0;bottom:0;right:auto;width:214px;max-width:none;margin:0;border-radius:0;flex-direction:column;justify-content:flex-start;gap:4px;padding:78px 10px 16px;background:var(--sf);box-shadow:1px 0 0 var(--ln);backdrop-filter:none}
  .nav::before{content:"Comptes du foyer";position:absolute;top:24px;left:22px;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
  .tab{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;flex:none;font-size:.95rem;padding:11px 14px}
  .te{height:auto}
  .tab.plus{display:none}.tab.extra{display:flex}
  .sheet{align-items:center}
  .sheetin{max-width:540px;border-radius:24px;padding-bottom:20px;max-height:84vh}
  #toast{bottom:28px}
  .hero .big{font-size:3rem}
  .cats .cv{font-size:1.4rem}
  .dsvg{width:240px}
  .sec>.row:hover{cursor:pointer}
}
@media (min-width:1700px){.mflow{column-width:380px}}

.fmplog{display:grid;gap:4px;margin-top:10px;font-size:.84rem;background:var(--in);border-radius:12px;padding:10px 12px}.fmplog b{font-weight:800}
.mst b{font-weight:800}.ct em{text-transform:none}

.sal{grid-template-columns:1fr!important}

/* ---- v4 : tuiles de cours par classe d'actif, variations, ajouts discrets ---- */
.ct{background:var(--in)}
.ct.etf{background:color-mix(in srgb,#4a6fa5 13%,var(--sf))}.ct.etc{background:color-mix(in srgb,#b08d57 17%,var(--sf))}.ct.cry{background:color-mix(in srgb,#8a7ba6 15%,var(--sf))}
.ct b{font-size:1.02rem}.ct em{font-style:normal;font-size:.72rem;color:var(--mu)}
.chg{font-weight:700;font-size:.74rem!important}.chg.up{color:var(--pos)!important}.chg.dn{color:var(--neg)!important}.chg.flat{color:var(--mu)!important}
.rt small .chg{font-size:.78rem!important}
.ct em.man{font-size:.66rem;color:var(--mu);font-style:italic}
.legend2{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.74rem;color:var(--mu)}.legend2 span{display:inline-flex;align-items:center;gap:5px}
.lg{width:10px;height:10px;border-radius:3px;display:inline-block}.lg.etf{background:#4a6fa5}.lg.etc{background:#b08d57}.lg.cry{background:#8a7ba6}
small.mu{color:var(--mu)!important;font-weight:600}
.hchips .ci{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:6px;border-radius:50%;border:1.3px solid rgba(255,255,255,.75);font:italic 700 .62rem/1 Georgia,serif;vertical-align:1px}
.addw{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:6px}
.add.mini{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;padding:0;margin:0;border:0;border-radius:50%;background:var(--in);color:var(--ac);line-height:0}
.add.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:auto;height:32px;margin:0;padding:0 14px;border:0;border-radius:99px;background:var(--in);color:var(--ac);font-size:.82rem;font-weight:700;line-height:1}
.add.mini .ic,.add.pill .ic{width:16px;height:16px;stroke-width:2.4;flex:none;display:block}
.add.pill span{display:block;line-height:1;transform:translateY(.5px)}
@media (hover:hover){.add.mini:hover,.add.pill:hover{background:var(--track);border-color:transparent}}
.yh{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:2px 0;font:inherit;font-weight:800;font-size:1.05rem;color:inherit;cursor:pointer}
.yi{display:grid;place-items:center;color:var(--mu)}.yi .ic{width:15px;height:15px}

/* ---- v5 : carte des personnes (Accueil), infobulle sur le « i » seulement ---- */
.person .pk{margin-top:8px}.person .pk small{display:block;font-size:.74rem;color:var(--mu);font-weight:600}
.person .pbig{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.person .faint{margin-top:10px;font-size:.74rem;color:var(--mu);opacity:.85;display:flex;align-items:center;gap:2px}
.hchips .ci{cursor:help}.hchips span[data-tip]{cursor:default}
.lleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 2px;font-size:.78rem;color:var(--mu)}.lleg span{display:inline-flex;align-items:center;gap:6px}.lleg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.lleg b{color:var(--ink)}

/* ---- v6 : sablier « retrait possible » (plus petit que le i, placé en haut) ---- */
.ht .hg{align-self:flex-start;margin:2px 0 0 -2px;font-size:.6rem;line-height:1;cursor:help;user-select:none;filter:saturate(.85)}

.chg{white-space:nowrap}

/* ---- v7 : QR de partage, mode discret ---- */
.qrbox{background:#fff;border-radius:16px;padding:10px;width:min(100%,340px);margin:0 auto 10px;box-shadow:0 0 0 1px var(--ln)}.qrbox svg{display:block;width:100%;height:auto}
.codebox{background:var(--in);border-radius:14px;padding:10px 12px;text-align:center;margin:8px 0}.codebox small{display:block;color:var(--mu);font-size:.76rem;margin-bottom:2px}.codebox b{font-size:1.5rem;letter-spacing:.12em;font-variant-numeric:tabular-nums}
[data-hide]{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* ---- v8 : carte du patrimoine cliquable (mode discret) ---- */
.hero[data-hide]{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hero[data-hide]:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}
.hero .eye{position:absolute;top:16px;right:18px;z-index:2;opacity:.85;line-height:0}.hero .eye .ic{width:22px;height:22px;stroke:#fff;stroke-width:1.9}

function repartActifs(P, keys) {

    c.actifs.forEach(a => { if (a.valeur > 0) items.push({ l: a.nom + (multi ? ' (' + (k === 'ctoA' ? 'CTO' : p.titre) + ')' : ''), v: a.valeur, c: k === 'ctoA' ? bronze[ci++ % 2] : blues[bi++ % 5] }); });

      await fetch(ghUrlFor(dir + 'isins.json'), { method: 'PUT', headers: { ...ghHead(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }
  } catch (e) {}
  try {
    const r = await fetch(ghUrlFor(dir + 'cours.json') + q, { headers: ghHead(), cache: 'no-store' });
    if (r.status === 404) return { err: 'cours.json absent : lance le workflow « Cours des ETF » (dépôt privé, onglet Actions)' };
    if (!r.ok) return { err: 'GitHub ' + r.status };
    return JSON.parse(utf64((await r.json()).content));
  } catch (e) { return { err: errTxt(e) }; }
}
/* Demande à GitHub de lancer le relais tout de suite (droit « Actions » du jeton nécessaire) */
async function triggerRelay() {
  if (Date.now() - (+LS.get('cc.disp') || 0) < 90000) return { ok: false, msg: 'un lancement a déjà été demandé il y a moins de 90 secondes' };
  LS.set('cc.disp', String(Date.now()));
  try {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(CFG.owner)}/${encodeURIComponent(CFG.repo)}/actions/workflows/cours.yml/dispatches`, { method: 'POST', headers: { ...ghHead(), 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: CFG.branch }) });
    if (r.status === 204) return { ok: true };
    return { ok: false, msg: r.status === 403 || r.status === 404 ? 'lancement refusé (le jeton n\'a pas le droit « Actions »)' : 'GitHub ' + r.status };
  } catch (e) { return { ok: false, msg: errTxt(e) }; }
}
/* Range dans l'appli les cours du relais (garde-fous : cours récent, écart < 40 % du cours saisi) */
function applyFeed(feed, isins) {
  const errs = {}, fresh = t => !t || Date.now() - new Date(t) < 8 * 864e5, fe = feed.errors || {};
  const m = feed.metals;
  if (m && m.orOnce > 0) { METALS = { orOnce: m.orOnce, argentOnce: m.argentOnce, date: m.time || feed.date }; CHG.or = m.orChg; CHG.argent = m.argentChg; LS.set('cc.metals', JSON.stringify(METALS)); if (m.stale) errs['Or / argent'] = 'source injoignable : dernier cours conservé'; }
  if (fe.metals) errs['Or / argent'] = fe.metals;
  const c = feed.crypto;
  if (c && c.btc) { CRYPTO = { btc: c.btc.price, eth: c.eth && c.eth.price, sol: c.sol && c.sol.price, date: c.time || feed.date }; CHG.btc = c.btc.chg; CHG.eth = c.eth && c.eth.chg; CHG.sol = c.sol && c.sol.chg; LS.set('cc.crypto', JSON.stringify(CRYPTO)); if (c.stale) errs['Crypto'] = 'source injoignable : dernier cours conservé'; }
  if (fe.crypto) errs['Crypto'] = fe.crypto;
  const acts = allActifs(), q = {}, notes = []; let ok = 0;
  for (const isin of isins) {
    const fp = feed.prices && feed.prices[isin];
    if (fp && fp.price > 0 && fresh(fp.time) && !fp.stale) {
      const ref = acts.find(a => a.isin === isin), man = ref ? num(ref.cours) : 0;
      if (man > 0 && Math.abs(fp.price / man - 1) > 0.4) { notes.push(`${isin} : écart suspect (${fp.price.toFixed(2)} contre ${man} saisi), cours ignoré`); continue; }
      q[isin] = fp.price; CHG[isin] = fp.chg; ok++;
    } else notes.push(`${isin} : ${fe[isin] || 'pas de cours récent'}`);
  }
  ETFQ = q; LS.set('cc.etfq', JSON.stringify(ETFQ)); LS.set('cc.chg', JSON.stringify(CHG)); LS.set('cc.etfdate', feed.date || '');
  if (notes.length) errs['ETF'] = `${ok}/${isins.length} à jour · ` + notes.slice(0, 2).join(' · ');
  return errs;
}
async function fetchLive(force) {
  if (force !== true && Date.now() - LAST_LIVE < 120000) return;
  LAST_LIVE = Date.now();
  metalsState = 'busy'; LIVE_MSG = ''; if (view === 'placements' || view === 'reglages') render();
  const isins = allIsins();
  let feed = await readFeed(isins), errs = {};
  if (!feed.err) { errs = applyFeed(feed, isins); R = recalc(); render(); }          // les derniers cours s'affichent tout de suite
  if (force === true && !feed.err && cfgOK()) {
    const t = await triggerRelay(), before = feed.date;
    if (t.ok) {
      const t0 = Date.now(); setLiveMsg('relais lancé…');
      for (let i = 0; i < 30; i++) {
        await new Promise(r => setTimeout(r, i === 0 ? RELAY_POLL_MS * 3 : RELAY_POLL_MS));
        setLiveMsg('relais en cours… ' + Math.round((Date.now() - t0) / 1000) + ' s');
        const f = await readFeed(isins, true);
        if (!f.err && f.date !== before) { feed = f; errs = applyFeed(f, isins); break; }
      }
    }
    else errs['Relais'] = t.msg + ' : cours du dernier passage utilisés (passage automatique toutes les heures en séance)';
  }
  if (feed.err) errs['Relais'] = feed.err;
  LIVE_ERR = errs; metalsState = Object.keys(errs).length ? 'err' : 'ok'; R = recalc(); render();
}

/* ---------- Événements ---------- */
const NEW = {
  salaires: () => ({ label: '', montant: 0, who: 'a', imposable: true }), quotidien: () => ({ label: '', montant: 0, who: '' }), loisirs: () => ({ label: '', montant: 0, who: '' }),
  vacances: () => ({ label: '', montant: 0 }), virements: () => ({ label: '', montant: 0 }), comptes: () => ({ label: '', banque: '', who: 'a', montant: 0 }),

};
const sortAchats = () => S.achats.sort((a, b) => (parseInt(a.annee) || 9999) - (parseInt(b.annee) || 9999));
const thisMonth = () => new Date().toISOString().slice(0, 7);
function newItem(path) {
  if (NEW[path]) return NEW[path]();
  if (/\.actifs$/.test(path)) return { nom: '', isin: '', cours: 0, pru: 0, lots: [] };
  if (/\.lots$/.test(path)) return { date: thisMonth(), qty: 0, ...(/\.(ctoA|avA)\./.test(path) ? { montant: 0 } : {}) };
  if (/\.virements$/.test(path)) return { date: thisMonth(), montant: 0 };

  return {};
}
document.addEventListener('change', e => {
  const el = e.target.closest('[data-p]');
  if (el) {
    const p = el.dataset.p, t = el.dataset.t; let v;
    if (t === 'chk') v = el.checked; else if (t === 'sel' || t === 'text' || t === 'month' || t === 'date') v = el.value;
    else if (t === 'pct') v = num(el.value) / 100; else v = el.value.trim() === '' ? '' : num(el.value);
    if (p.startsWith('cfg.')) { CFG[p.slice(4)] = v; LS.set('cc.cfg', JSON.stringify(CFG)); render(); return; }
    set(S, p, v); commit(); return;
  }
  if (e.target.dataset && e.target.dataset.act === 'shareenc') { shareEnc = e.target.checked; render(); return; }
  if (e.target.dataset && e.target.dataset.act === 'showsecrets') { showSecrets = e.target.checked; render(); return; }

});
function closeOverlay() {
  if (tipFor) { hideTip(); return true; }
  if (editing || moreOpen || dlg) {
    const a = document.activeElement; if (a && a.blur && a.tagName !== 'BODY') a.blur();          // valide la saisie en cours
    if (editing && /^achats\.\d+$/.test(editing.path)) sortAchats();

  }

}
const isEsc = e => e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27;
window.addEventListener('keydown', e => { if (isEsc(e) && closeOverlay()) { e.preventDefault(); e.stopPropagation(); } }, true);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function bump(el) {
  if (REDUCED || !el || !el.animate) return;
  el.animate([{ transform: 'scale(1)' }, { transform: 'scale(.965)', offset: .3 }, { transform: 'scale(1.02)', offset: .68 }, { transform: 'scale(1)' }], { duration: 780, easing: 'cubic-bezier(.33,1,.68,1)' });
}
function donutTap(w, i) {
  const segs = [...w.querySelectorAll('circle.seg')], lis = [...w.querySelectorAll('.dleg li')], cen = w.querySelector('.dcen');
  const same = w.dataset.sel === String(i);
  w.dataset.sel = same ? '' : String(i);

  lis.forEach((l, k) => l.classList.toggle('dim', !same && k !== i));
  const li = lis[i];
  cen.querySelector('small').textContent = same ? cen.dataset.t : `${li.children[1].textContent} · ${li.children[3].textContent}`;
  cen.querySelector('b').textContent = same ? cen.dataset.c : li.children[2].textContent;
  if (!same && !REDUCED) cen.animate([{ transform: 'scale(.9)', opacity: .4 }, { transform: 'scale(1)', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.33,1,.68,1)' });
}
function toggleHide() {
  HIDE = !HIDE; LS.set('cc.hide', HIDE ? '1' : '0'); render();
  bump(document.querySelector('[data-hide]'));                       // même rebond que les autres cartes, sur la carte réaffichée
  toast(HIDE ? 'Montants masqués (clique sur la carte pour les réafficher)' : 'Montants affichés');

document.addEventListener('keydown', e => { const h = e.target.closest && e.target.closest('[data-hide]'); if (h && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleHide(); } });
document.addEventListener('click', async e => {
  if (e.target.closest('[data-hide]') && !e.target.closest('[data-tip],button,input,select,label,a')) { toggleHide(); return; }
  const tp = e.target.closest('[data-tip]');

  const sg = e.target.closest('circle.seg, .dleg li');

  const card = e.target.closest('.cat,.person,.hero,.pm1,.dsvg,.vbc,.hbr,.prow,.split .kv,.pmain,.salc,.ct');
  if (card && !e.target.closest('button,input,select,label')) bump(card);
  const t = e.target.closest('button,[data-close]'); if (!t) return;
  const d = t.dataset;

  if (d.edit) { editing = { path: d.edit }; render(); return; }
  if (d.ef) { ef = d.ef; LS.set('cc.ef', ef); render(); window.scrollTo(0, 0); return; }
  if (d.pf) { pf = d.pf; LS.set('cc.pf', pf); render(); window.scrollTo(0, 0); return; }
  if (d.bmode) { bmode = d.bmode; LS.set('cc.bmode', bmode); render(); window.scrollTo(0, 0); return; }
  if (d.go) { view = d.go; moreOpen = false; editing = null; render(); window.scrollTo(0, 0); return; }

  if (d.qv) { const arr = get(S, d.qv), m = thisMonth(); if (!arr.some(v => v.date === m)) arr.push({ date: m, montant: arr.length ? num(arr[arr.length - 1].montant) : 0 }); editing = { path: d.qv }; commit(); return; }
  if (d.add) { const arr = get(S, d.add); arr.push(newItem(d.add)); editing = { path: d.add + '.' + (arr.length - 1) }; commit(); return; }
  if (d.addin) { get(S, d.addin).push(newItem(d.addin)); commit(); return; }
  if (d.delin) { const ks = d.delin.split('.'), i = +ks.pop(); get(S, ks.join('.')).splice(i, 1); commit(); return; }
  if (d.delete) { const ks = d.delete.split('.'), i = +ks.pop(); get(S, ks.join('.')).splice(i, 1); editing = null; commit(); return; }
  if ('addyear' in d) { const a = S.interets.annees; a.push(a[a.length - 1] + 1); commit(); return; }
  if ('addyearachat' in d) { const ys = S.achats.map(y => parseInt(y.annee)).filter(Number.isFinite); S.achats.push({ annee: String(ys.length ? Math.max(...ys) + 1 : new Date().getFullYear()), items: [] }); sortAchats(); commit(); return; }

async function importFile(f) {

  } catch (e) { toast('Import impossible : ' + e.message); }

/* Si une version plus récente est en ligne, la page se recharge toute seule (pas au milieu d'une saisie, une fois par version et par 5 min) */
let lastVerCheck = 0;
async function checkVersion() {
  if (Date.now() - lastVerCheck < 60000 || !/^https?:/.test(location.protocol)) return;

  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;

    if (last.v === m[1] && Date.now() - last.t < 300000) return;
    try { sessionStorage.setItem('cc.reloaded', JSON.stringify({ v: m[1], t: Date.now() })); } catch (e) {}

}
