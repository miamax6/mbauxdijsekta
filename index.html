<body><div id="app"></div>
<script>
/* ===== Logique pure : aucun accès au DOM ===== */
const EMPTY_STATE = () => ({
  app: 'comptes-couple', schema: 1,
  settings: {
    noms: { a: 'Moi', b: 'Conjoint·e' },
    impotTaux: { a: 0, b: 0 },
    taxes: { pea: 0.828, av: 0.828, cto: 0.7 },
    livretA: 0.015,
    credit: { mensualite: 0, nbMois: 0, debut: '' },
    vacancesDebut: '',
    reventeOr: 0.8,
    simu: { plafond: 0.35, duree: 25, taux: [0.03, 0.035, 0.04] },
    cours: { orOnce: 0, argentOnce: 0, date: '' }
  },
  salaires: [], quotidien: [], loisirs: [], vacances: [], virements: [], comptes: [],
  interets: { annees: [new Date().getFullYear()], lignes: [] },
  placements: {
    peaA: { titre: 'PEA', who: 'a', retrait: '', taxe: 'pea', virements: [], actifs: [] },
    ctoA: { titre: 'Compte-titres', who: 'a', taxe: 'cto', especes: 0, actifs: [] },
    avA: { titre: 'Assurance vie', who: 'a', retrait: '', taxe: 'av', fondsEuros: { investi: 0, taux: 0 }, actifs: [] },
    peaB: { titre: 'PEA', who: 'b', retrait: '', taxe: 'pea', virements: [], actifs: [] },
    objets: []
  },
  achats: [{ annee: String(new Date().getFullYear()), items: [] }]
});

const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const sum = (arr, f = x => x) => arr.reduce((s, x) => s + (f(x) || 0), 0);

function monthsBetween(fromISO, to) { // équivalent DATEDIF(..., "m")
  if (!fromISO) return 0;
  const f = new Date(fromISO + (fromISO.length === 7 ? '-01' : ''));
  let m = (to.getFullYear() - f.getFullYear()) * 12 + (to.getMonth() - f.getMonth());
  if (to.getDate() < f.getDate()) m--;
  return Math.max(0, m);
}

function calcPlacement(p, cfg, now) {
  const taxe = cfg.taxes[p.taxe] ?? 1;
  const actifs = (p.actifs || []).map(a => {
    const qty = sum(a.lots || [], l => num(l.qty));
    const cout = sum(a.lots || [], l => (l.montant !== undefined && l.montant !== '' && l.montant !== null) ? num(l.montant) : num(a.pru) * num(l.qty));
    const valeur = num(a.cours) * qty;
    return { ...a, qty, cout, valeur, pruCalc: qty ? cout / qty : 0, pv: valeur - cout };
  });
  const valeurActifs = sum(actifs, a => a.valeur);
  const coutActifs = sum(actifs, a => a.cout);
  const hasVirt = Array.isArray(p.virements);
  const investi = hasVirt ? sum(p.virements, v => num(v.montant)) : coutActifs;
  const especes = hasVirt ? investi - coutActifs : num(p.especes);
  let fonds = 0, fondsInvesti = 0;
  if (p.fondsEuros) { fondsInvesti = num(p.fondsEuros.investi); fonds = fondsInvesti; }
  const investiTotal = investi + fondsInvesti;
  // PEA : les espèces sont déjà dans la plus-value ; CTO : espèces à part (comme l'Excel)
  const pv = hasVirt ? valeurActifs + especes - investi : valeurActifs - investi;
  const pvNet = pv > 0 ? pv * taxe : pv;
  const totalApresImpot = hasVirt ? investi + pvNet : investiTotal + pvNet + (p.especes ? num(p.especes) : 0);
  const totalBrut = valeurActifs + fonds + (hasVirt ? especes : num(p.especes));
  const premier = hasVirt ? (p.virements.map(v => v.date).sort()[0] || '') : ((actifs.flatMap(a => (a.lots || []).map(l => l.date))).sort()[0] || '');
  const jours = premier ? Math.max(1, (now - new Date(premier + '-01')) / 864e5) : 0;
  const rendement = investiTotal ? pv / investiTotal : 0;
  return { actifs, valeurActifs, coutActifs, investi: investiTotal, especes, pv, pvNet, totalBrut, totalApresImpot, rendement,
           annualise: jours ? rendement / jours * 365 : 0, premier,
           retraitMois: p.retrait ? Math.max(0, monthsBetween(now.toISOString().slice(0, 10), new Date(p.retrait))) : null };
}

function calc(S, now = new Date()) {
  const cfg = S.settings, R = { cfg };
  // --- Revenus
  R.brut = { a: 0, b: 0 }; R.imposable = { a: 0, b: 0 };
  S.salaires.forEach(s => { R.brut[s.who] += num(s.montant); if (s.imposable) R.imposable[s.who] += num(s.montant); });
  R.impots = { a: R.imposable.a * num(cfg.impotTaux.a), b: R.imposable.b * num(cfg.impotTaux.b) };
  R.part = { a: R.brut.a - R.impots.a, b: R.brut.b - R.impots.b };
  R.brutTotal = R.brut.a + R.brut.b;
  R.net = R.part.a + R.part.b;
  R.ratio = { a: R.net ? R.part.a / R.net : 0.5, b: R.net ? R.part.b / R.net : 0.5 };
  // --- Vacances (moyenne mensuelle depuis la date de départ)
  R.vacTotal = sum(S.vacances, v => num(v.montant));
  let moisVac = 0;
  if (cfg.vacancesDebut) {
    const d = new Date(cfg.vacancesDebut);
    moisVac = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth()) + now.getDate() / 30;
  }
  R.vacMois = moisVac; R.vacMoy = moisVac > 0 ? R.vacTotal / moisVac : 0;
  const lig = l => l.auto === 'vacances' ? R.vacMoy : num(l.montant);
  // --- Dépenses
  const split = list => {
    const t = { tot: 0, a: 0, b: 0, commun: 0 };
    list.forEach(l => { const m = lig(l); t.tot += m; if (l.who === 'a') t.a += m; else if (l.who === 'b') t.b += m; else t.commun += m; });
    t.parA = t.commun * R.ratio.a + t.a; t.parB = t.commun * R.ratio.b + t.b; return t;
  };
  R.quot = split(S.quotidien); R.loisirs = split(S.loisirs);
  R.cible = { besoins: R.net * 0.5, envies: R.net * 0.3, epargne: R.net * 0.2 };
  R.reste = R.net - R.quot.tot - R.loisirs.tot;
  R.dispo = { a: R.part.a - R.quot.parA - R.loisirs.parA, b: R.part.b - R.quot.parB - R.loisirs.parB };
  // --- Virements vers le compte commun
  R.virements = { a: sum(S.virements, v => num(v.montant) * R.ratio.a), b: sum(S.virements, v => num(v.montant) * R.ratio.b) };
  R.virementsTot = sum(S.virements, v => num(v.montant));
  // --- Placements
  R.pl = {};
  ['peaA', 'ctoA', 'avA', 'peaB'].forEach(k => R.pl[k] = calcPlacement(S.placements[k], cfg, now));
  const or = num(cfg.cours.orOnce) / 31.1035;
  R.objets = S.placements.objets.map(o => ({ ...o, valeur: or * num(o.grammes) * num(o.titre) }));
  R.objetsBrut = sum(R.objets, o => o.valeur); R.objetsNet = R.objetsBrut * num(cfg.reventeOr);
  // --- Crédit auto : reste à payer
  const c = cfg.credit;
  R.creditReste = -Math.max(0, (num(c.nbMois) - monthsBetween(c.debut, now)) * num(c.mensualite));
  // --- Comptes
  const val = k => k === 'peaA' ? R.pl.peaA.totalApresImpot : k === 'peaB' ? R.pl.peaB.totalApresImpot :
    k === 'ctoA' ? R.pl.ctoA.totalApresImpot : k === 'avA' ? R.pl.avA.totalApresImpot : k === 'objets' ? R.objetsNet : k === 'credit' ? R.creditReste : 0;
  R.comptes = S.comptes.map(c => ({ ...c, valeur: c.auto ? val(c.auto) : num(c.montant) }));
  R.patrimoine = sum(R.comptes, c => c.valeur);
  R.parPersonne = { a: sum(R.comptes.filter(c => c.who === 'a'), c => c.valeur), b: sum(R.comptes.filter(c => c.who === 'b'), c => c.valeur) };
  R.apport = sum(R.comptes.filter(c => c.apport !== false), c => c.valeur);
  R.pvTotale = sum(Object.values(R.pl), p => p.pvNet); R.investiTotal = sum(Object.values(R.pl), p => p.investi);
  // --- Intérêts
  R.interets = {};
  S.interets.annees.forEach(y => R.interets[y] = sum(S.interets.lignes, l => num((l.v || {})[y])));
  // --- Achats / ventes
  R.achats = S.achats.map(y => ({ annee: y.annee, achats: sum(y.items, i => num(i.achat)), ventes: sum(y.items, i => num(i.vente)) }));
  R.achats.forEach(y => y.solde = y.ventes - y.achats);
  R.achatsSolde = sum(R.achats, y => y.solde);
  // --- Simulateur d'emprunt (mensualités constantes, formule d'annuité)
  const sm = cfg.simu; R.simu = { mensualite: R.brutTotal * num(sm.plafond), lignes: [] };
  sm.taux.forEach(t => {
    const n = num(sm.duree) * 12, r = num(t) / 12;
    const cap = R.simu.mensualite * (r ? (1 - Math.pow(1 + r, -n)) / r : n);
    R.simu.lignes.push({ taux: num(t), capital: cap, interets: R.simu.mensualite * n - cap, avecApport: cap + R.apport });
  });
  return R;
}

if (typeof module !== 'undefined') module.exports = { EMPTY_STATE, calc, num, monthsBetween };

</script>
<script>
/* ===== Interface ===== */
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (v, d = 0) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: d, minimumFractionDigits: d }).format(v || 0);
const pc = (v, d = 1) => new Intl.NumberFormat('fr-FR', { style: 'percent', maximumFractionDigits: d }).format(v || 0);
const dec = v => (v === undefined || v === null || v === '') ? '' : String(Math.round(v * 10000) / 10000).replace('.', ',');

let S = EMPTY_STATE(), R = null, view = 'accueil', moreOpen = false;
let meta = { sha: '', dirty: false, at: '' }, sync = { state: 'off', msg: '' };
const cfgDefault = { owner: '', repo: '', path: 'budget/donnees.enc.json', branch: 'main', token: '', pass: '' };
let CFG = Object.assign({}, cfgDefault, JSON.parse(LS.get('cc.cfg') || '{}'));

const N = k => (S.settings.noms[k] || k);
const get = (o, p) => p.split('.').reduce((x, k) => x == null ? x : x[k], o);
const set = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((x, k) => x[k], o); t[last] = v; };

/* ---------- Persistance locale + synchro ---------- */
function saveLocal() { LS.set('cc.state', JSON.stringify(S)); LS.set('cc.meta', JSON.stringify(meta)); }
function loadLocal() {
  try { const s = LS.get('cc.state'); if (s) S = Object.assign(EMPTY_STATE(), JSON.parse(s)); } catch (e) {}
  try { const m = LS.get('cc.meta'); if (m) meta = Object.assign(meta, JSON.parse(m)); } catch (e) {}
}
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encrypt(text, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
  const key = await deriveKey(pass, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text)));
  return JSON.stringify({ v: 1, kdf: 'PBKDF2-SHA256', iter, salt: b64(salt), iv: b64(iv), ct: b64(ct) });
}
async function decrypt(envelope, pass) {
  const e = JSON.parse(envelope); const key = await deriveKey(pass, unb64(e.salt), e.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(e.iv) }, key, unb64(e.ct));
  return new TextDecoder().decode(pt);
}
const cfgOK = () => CFG.owner && CFG.repo && CFG.path && CFG.token && CFG.pass;
const ghUrl = () => `https://api.github.com/repos/${encodeURIComponent(CFG.owner)}/${encodeURIComponent(CFG.repo)}/contents/${CFG.path.split('/').map(encodeURIComponent).join('/')}`;
const ghHead = () => ({ Authorization: 'Bearer ' + CFG.token, Accept: 'application/vnd.github+json' });
async function ghRead() {
  const r = await fetch(`${ghUrl()}?ref=${encodeURIComponent(CFG.branch)}&t=${Date.now()}`, { headers: ghHead(), cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('GitHub ' + r.status + (r.status === 401 ? ' : jeton refusé' : r.status === 403 ? ' : droits insuffisants' : ''));
  const j = await r.json(); return { sha: j.sha, text: atob(j.content.replace(/\n/g, '')) };
}
async function ghWrite(text, sha) {
  const body = { message: 'Mise à jour ' + new Date().toISOString().slice(0, 16), content: btoa(text), branch: CFG.branch };
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(), { method: 'PUT', headers: { ...ghHead(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('GitHub ' + r.status + (r.status === 409 || r.status === 422 ? ' : conflit' : ''));
  return (await r.json()).content.sha;
}
function setSync(state, msg = '') { sync = { state, msg }; const el = document.getElementById('syncpill'); if (el) paintPill(el); }
function paintPill(el) {
  const map = { off: ['Local', 'off'], ok: ['Synchronisé', 'ok'], dirty: ['Modifié', 'warn'], busy: ['Synchro…', 'warn'], err: ['Erreur', 'bad'], conflict: ['Conflit', 'bad'] };
  const [t, c] = map[sync.state] || map.off; el.textContent = t; el.className = 'pill ' + c; el.title = sync.msg;
}
async function pull(silent) {
  if (!cfgOK()) return;
  setSync('busy');
  try {
    const rem = await ghRead();
    if (!rem) { setSync(meta.dirty || S.salaires.length ? 'dirty' : 'off', 'Aucune donnée distante'); if (S.salaires.length) await push(); return; }
    if (rem.sha === meta.sha) { setSync(meta.dirty ? 'dirty' : 'ok'); if (meta.dirty) schedulePush(); return; }
    if (meta.dirty) { setSync('conflict', 'La version distante a changé'); render(); return; }
    S = Object.assign(EMPTY_STATE(), JSON.parse(await decrypt(rem.text, CFG.pass)));
    meta = { sha: rem.sha, dirty: false, at: new Date().toISOString() }; saveLocal(); setSync('ok'); R = calc(S); render();
  } catch (e) { setSync('err', e.name === 'OperationError' ? 'Phrase secrète incorrecte' : e.message); if (!silent) toast(sync.msg); }
}
async function push(force) {
  if (!cfgOK()) return;
  setSync('busy');
  try {
    const rem = await ghRead();
    if (rem && rem.sha !== meta.sha && !force) { setSync('conflict', 'La version distante a changé'); render(); return; }
    const sha = await ghWrite(await encrypt(JSON.stringify(S), CFG.pass), rem ? rem.sha : undefined);
    meta = { sha, dirty: false, at: new Date().toISOString() }; saveLocal(); setSync('ok');
  } catch (e) { setSync('err', e.message); }
}
let pushTimer = null;
function schedulePush() { if (!cfgOK()) return; clearTimeout(pushTimer); pushTimer = setTimeout(() => push(), 1800); }
function commit() { R = calc(S); meta.dirty = true; saveLocal(); if (cfgOK() && sync.state !== 'conflict') { setSync('dirty'); schedulePush(); } renderKeepFocus(); }

/* ---------- Petits composants ---------- */
function fld(path, val, o = {}) {
  const t = o.t || 'num';
  if (t === 'chk') return `<label class="chk"><input type="checkbox" data-p="${path}" data-t="chk" ${val ? 'checked' : ''}><span>${esc(o.txt || '')}</span></label>`;
  if (t === 'sel') return `<select class="f" data-p="${path}" data-t="sel" aria-label="${esc(o.label || '')}">${o.opts.map(([v, l]) => `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const v = t === 'pct' ? dec((val || 0) * 100) : t === 'num' ? dec(val) : esc(val);
  const type = o.pw ? 'password' : t === 'month' ? 'month' : t === 'date' ? 'date' : 'text';
  return `<input class="f ${o.cls || ''}" type="${type}" data-p="${path}" data-t="${t}" value="${v}" ${type === 'text' ? `inputmode="${t === 'text' ? 'text' : 'decimal'}"` : ''} ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} aria-label="${esc(o.label || o.ph || '')}" ${o.ro ? 'readonly' : ''}>`;
}
const whoOpts = (shared) => [...(shared ? [['', 'Commun']] : []), ['a', N('a')], ['b', N('b')]];
function line(list, i, l, o = {}) {
  const p = `${list}.${i}`;
  return `<div class="line ${o.who === false ? 'nowho' : ''}">
    ${fld(p + '.label', l.label, { t: 'text', ph: 'Libellé', cls: 'lab' })}
    ${l.auto === 'vacances' ? `<span class="calc" title="Calculé depuis Vacances">${eur(R.vacMoy)}</span>` : fld(p + '.montant', l.montant, { ph: '0' })}
    ${o.who === false ? '' : fld(p + '.who', l.who, { t: 'sel', opts: whoOpts(o.shared !== false), label: 'Qui' })}
    ${o.extra || ''}
    <button class="x" data-del="${p}" aria-label="Supprimer">×</button></div>`;
}
const addBtn = (path, txt) => `<button class="add" data-add="${path}">+ ${txt}</button>`;
const sec = (title, body, right = '') => `<section class="sec"><header><h2>${title}</h2>${right ? `<span class="tot">${right}</span>` : ''}</header>${body}</section>`;
const kv = (k, v, cls = '') => `<div class="kv"><span>${k}</span><b class="${cls}">${v}</b></div>`;
const sign = v => v < 0 ? 'neg' : 'pos';

  const pct = v => Math.max(0, Math.min(100, v / R.net * 100));
  const q = pct(R.quot.tot), l = pct(R.loisirs.tot), r = Math.max(0, 100 - q - l);
  const person = k => `<div class="person p${k}"><h3>${esc(N(k))} <small>${pc(R.ratio[k], 0)} du foyer</small></h3>
    ${kv('Net', eur(R.part[k]))}${kv('Quotidien', '− ' + eur(k === 'a' ? R.quot.parA : R.quot.parB))}${kv('Loisirs', '− ' + eur(k === 'a' ? R.loisirs.parA : R.loisirs.parB))}

  const yrs = S.interets.annees.filter(y => R.interets[y]).map(y => kv('Intérêts ' + y, eur(R.interets[y]))).join('');

    <ul class="legend"><li><i class="s1"></i>Quotidien ${eur(R.quot.tot)} <em>${pc(q / 100, 0)} · cible 50 %</em></li>
      <li><i class="s2"></i>Loisirs ${eur(R.loisirs.tot)} <em>${pc(l / 100, 0)} · cible 30 %</em></li>
      <li><i class="s3"></i>Reste ${eur(R.reste)} <em>${pc(r / 100, 0)} · cible 20 %</em></li></ul></section>
  <div class="two">${person('a')}${person('b')}</div>
  ${sec('Patrimoine', kv('Total', eur(R.patrimoine), 'pos') + kv(N('a'), eur(R.parPersonne.a)) + kv(N('b'), eur(R.parPersonne.b)) +

function placeBlock(key) {
  const p = S.placements[key], c = R.pl[key], hasVirt = Array.isArray(p.virements);
  const actifs = c.actifs.map((a, i) => {
    const base = `placements.${key}.actifs.${i}`;
    const lots = (a.lots || []).map((l, j) => `<div class="lot">${fld(`${base}.lots.${j}.date`, l.date, { t: 'month' })}${fld(`${base}.lots.${j}.qty`, l.qty, { ph: 'Qté' })}
      ${hasVirt ? '' : fld(`${base}.lots.${j}.montant`, l.montant, { ph: '€ payés' })}<button class="x" data-del="${base}.lots.${j}">×</button></div>`).join('');
    return `<div class="asset"><div class="ahead">${fld(base + '.nom', a.nom, { t: 'text', cls: 'lab' })}<button class="x" data-del="${base}">×</button></div>
      <div class="isin">${fld(base + '.isin', a.isin, { t: 'text', ph: 'ISIN' })}</div>
      <div class="grid3"><label>Cours${fld(base + '.cours', a.cours)}</label>${hasVirt || p.fondsEuros ? `<label>PRU${fld(base + '.pru', a.pru)}</label>` : `<label>PRU calculé<span class="calc">${dec(a.pruCalc)}</span></label>`}<label>Quantité<span class="calc">${dec(a.qty)}</span></label></div>
      ${kv('Valeur', eur(a.valeur, 2))}${kv('Plus-value', eur(a.pv, 2), sign(a.pv))}
      <details><summary>Achats (${(a.lots || []).length})</summary>${lots}${addBtn(base + '.lots', 'Achat')}</details></div>`;
  }).join('');
  const virt = hasVirt ? `<details><summary>Virements versés (${p.virements.length})</summary>${p.virements.map((v, j) => `<div class="lot">${fld(`placements.${key}.virements.${j}.date`, v.date, { t: 'month' })}${fld(`placements.${key}.virements.${j}.montant`, v.montant, { ph: '€' })}<button class="x" data-del="placements.${key}.virements.${j}">×</button></div>`).join('')}${addBtn(`placements.${key}.virements`, 'Virement')}</details>` : '';
  const fe = p.fondsEuros ? `<div class="inl3"><label>Fonds euros investi${fld(`placements.${key}.fondsEuros.investi`, p.fondsEuros.investi)}</label><label>Taux${fld(`placements.${key}.fondsEuros.taux`, p.fondsEuros.taux, { t: 'pct' })}</label></div>` : '';
  const esp = (!hasVirt && key === 'ctoA') ? `<div class="inl"><span>Espèces</span>${fld(`placements.${key}.especes`, p.especes)}</div>` : '';
  const ret = p.retrait !== undefined ? `<div class="inl"><span>Retrait possible le</span>${fld(`placements.${key}.retrait`, p.retrait, { t: 'date' })}${c.retraitMois != null && p.retrait ? `<em>${c.retraitMois >= 12 ? Math.floor(c.retraitMois / 12) + ' an' + (c.retraitMois >= 24 ? 's' : '') + ' ' : ''}${c.retraitMois % 12} mois</em>` : ''}</div>` : '';
  return sec(`${esc(p.titre)} · ${esc(N(p.who))}`,
    kv('Investi', eur(c.investi, 2)) + (hasVirt ? kv('Espèces', eur(c.especes, 2)) : '') + kv('Valeur', eur(c.totalBrut, 2)) +
    kv('Plus-value nette', eur(c.pvNet, 2), sign(c.pvNet)) + kv('Rendement', pc(c.rendement) + ' · ' + pc(c.annualise) + '/an') + kv('Total après impôt', eur(c.totalApresImpot, 2), 'pos') +
    ret + esp + fe + actifs + addBtn(`placements.${key}.actifs`, 'Actif') + virt, eur(c.totalApresImpot));
}

    <p class="hint">Le fichier exporté contient tes chiffres en clair : garde-le hors de tout dossier public.</p>`)}
  ${sec('Prénoms et fiscalité', `<div class="grid3"><label>Prénom 1${fld('settings.noms.a', s.noms.a, { t: 'text' })}</label><label>Prénom 2${fld('settings.noms.b', s.noms.b, { t: 'text' })}</label></div>
    <div class="grid3"><label>Après impôt PEA${fld('settings.taxes.pea', s.taxes.pea, { t: 'pct' })}</label><label>Après impôt AV${fld('settings.taxes.av', s.taxes.av, { t: 'pct' })}</label><label>Après impôt CTO${fld('settings.taxes.cto', s.taxes.cto, { t: 'pct' })}</label></div>
    <p class="hint">Ces trois taux sont la part qui reste après impôt (0,828 = 17,2 % prélevés). À faire valider par toi : ils étaient écrits en dur dans l'Excel.</p>
    <div class="grid3"><label>Livret A (comparaison)${fld('settings.livretA', s.livretA, { t: 'pct' })}</label></div>`)}
  ${sec('Vider cet appareil', `<button class="btn danger" data-act="reset">Effacer les données locales</button><p class="hint">Ne touche pas au dépôt GitHub.</p>`)}`;
}

const VIEWS = { accueil: ['Accueil', vAccueil], budget: ['Budget', vBudget], epargne: ['Épargne', vEpargne], placements: ['Placements', vPlacements], achats: ['Achats et ventes', vAchats], simu: ['Emprunt', vSimu], reglages: ['Réglages', vReglages] };
const ICONS = { accueil: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', budget: 'M4 6h16M4 12h16M4 18h10', epargne: 'M12 3c5 0 8 3 8 7s-3 8-8 8-8-4-8-8 3-7 8-7zm0 5v5m-2-3h4', placements: 'M4 19V9m6 10V5m6 14v-7m4 7H2', more: 'M5 12h.01M12 12h.01M19 12h.01' };
const tab = (k, label) => `<button class="tab ${view === k ? 'on' : ''}" data-go="${k}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[k]}"/></svg><span>${label}</span></button>`;

function render() {
  R = R || calc(S);
  const [title, fn] = VIEWS[view];
  document.getElementById('app').innerHTML = `
  <header class="top"><h1>${title}</h1><span id="syncpill" class="pill off"></span></header>
  <main>${fn()}</main>
  <nav class="nav">${tab('accueil', 'Accueil')}${tab('budget', 'Budget')}${tab('epargne', 'Épargne')}${tab('placements', 'Placements')}
    <button class="tab ${['achats', 'simu', 'reglages'].includes(view) ? 'on' : ''}" data-more><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS.more}"/></svg><span>Plus</span></button></nav>
  ${moreOpen ? `<div class="sheet" data-close><div class="sheetin"><button data-go="achats">Achats et ventes</button><button data-go="simu">Emprunt</button><button data-go="reglages">Réglages</button></div></div>` : ''}
  <div id="toast" role="status"></div>`;
  paintPill(document.getElementById('syncpill'));
}
function renderKeepFocus() {
  setTimeout(() => {
    const a = document.activeElement, p = a && a.dataset && a.dataset.p, y = window.scrollY;
    render(); window.scrollTo(0, y);
    if (p) { const el = document.querySelector(`[data-p="${p}"]`); if (el && el.type !== 'checkbox' && el.tagName !== 'SELECT') try { el.focus({ preventScroll: true }); } catch (e) {} }
  }, 0);
}
function toast(t) { const el = document.getElementById('toast'); if (!el) return; el.textContent = t; el.className = 'show'; setTimeout(() => el.className = '', 3200); }

/* ---------- Événements ---------- */
const NEW = {
  salaires: () => ({ label: '', montant: 0, who: 'a', imposable: true }), quotidien: () => ({ label: '', montant: 0, who: '' }), loisirs: () => ({ label: '', montant: 0, who: '' }),
  vacances: () => ({ label: '', montant: 0 }), virements: () => ({ label: '', montant: 0 }), comptes: () => ({ label: '', banque: '', who: 'a', montant: 0 }),
  'interets.lignes': () => ({ label: '', who: 'a', v: {} }), 'placements.objets': () => ({ label: '', grammes: 0, titre: 1 })
};
function newItem(path) {
  if (NEW[path]) return NEW[path]();
  if (/\.actifs$/.test(path)) return { nom: '', isin: '', cours: 0, pru: 0, lots: [] };
  if (/\.lots$/.test(path)) return { date: new Date().toISOString().slice(0, 7), qty: 0 };
  if (/\.virements$/.test(path)) return { date: new Date().toISOString().slice(0, 7), montant: 0 };
  if (/\.items$/.test(path)) return { label: '', achat: 0, vente: 0, who: 'a' };
  return {};
}
document.addEventListener('change', e => {
  const el = e.target.closest('[data-p]');
  if (el) {
    const p = el.dataset.p, t = el.dataset.t; let v;
    if (t === 'chk') v = el.checked; else if (t === 'sel' || t === 'text' || t === 'month' || t === 'date') v = el.value;
    else if (t === 'pct') v = num(el.value) / 100; else v = el.value.trim() === '' ? '' : num(el.value);
    if (p.startsWith('cfg.')) { CFG[p.slice(4)] = v; LS.set('cc.cfg', JSON.stringify(CFG)); render(); return; }
    set(S, p, v); commit(); return;
  }
  if (e.target.dataset && e.target.dataset.act === 'import') importFile(e.target.files[0]);
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-close]'); if (!t) return;
  const d = t.dataset, y = window.scrollY;
  if (d.go) { view = d.go; moreOpen = false; render(); window.scrollTo(0, 0); return; }
  if ('more' in d) { moreOpen = true; render(); return; }
  if ('close' in d && e.target === t) { moreOpen = false; render(); return; }
  if (d.add) { const arr = get(S, d.add); arr.push(newItem(d.add)); commit(); return; }
  if (d.del) { const ks = d.del.split('.'), i = +ks.pop(); get(S, ks.join('.')).splice(i, 1); commit(); return; }
  if ('addyear' in d) { const a = S.interets.annees; a.push(a[a.length - 1] + 1); commit(); return; }
  if ('addyearachat' in d) { S.achats.push({ annee: String(new Date().getFullYear() + S.achats.length), items: [] }); commit(); return; }
  if (d.act === 'syncnow') { await pull(false); if (sync.state === 'dirty') await push(); if (sync.state === 'ok') toast('Synchronisé'); render(); return; }
  if (d.act === 'keeplocal') { await push(true); render(); return; }
  if (d.act === 'keepremote') { meta.dirty = false; meta.sha = ''; await pull(false); render(); return; }
  if (d.act === 'export') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'comptes-couple_donnees_' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); return; }
  if (d.act === 'reset') { if (confirm('Effacer les données de cet appareil ?')) { LS.del('cc.state'); LS.del('cc.meta'); S = EMPTY_STATE(); meta = { sha: '', dirty: false, at: '' }; R = calc(S); render(); } return; }
});
async function importFile(f) {
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'comptes-couple') throw new Error('Ce fichier n\'est pas un fichier de données de l\'appli.');
    S = Object.assign(EMPTY_STATE(), j); R = calc(S); meta.dirty = true; saveLocal(); view = 'accueil'; render(); toast('Fichier importé'); schedulePush();
  } catch (e) { toast('Import impossible : ' + e.message); }
}

/* ---------- Démarrage ---------- */
loadLocal(); R = calc(S); render();
if (cfgOK()) pull(true);
window.addEventListener('online', () => { if (cfgOK()) pull(true); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfgOK() && !meta.dirty) pull(true); });

</script></body></html>
